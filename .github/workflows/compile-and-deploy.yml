name: Bulk Compile Presentations, Labs & Assignments & Deploy to Web

on:
  push:
    branches:
      - main

jobs:
  build-materials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Create Global Build Directory
        run: |
          mkdir -p build_output
          chmod 777 build_output

      # ==========================================
      # 1. KROK: Prezentacje i Laboratoria (Marp Docker)
      # ==========================================
      - name: Process Presentations & Laboratories
        run: |
          echo "=== Processing Presentations & Labs ==="
          for dir in presentations/*/*/; do
            if [ -d "$dir" ]; then
              # Usuwa "presentations/" z początku ścieżki (zostaje np. "lectures/lecture01-intro/")
              rel_path=${dir#presentations/}
              rel_path=${rel_path%/}
              
              echo "Processing: $rel_path"
              md_file=$(find "$dir" -maxdepth 1 -name "*.md" ! -name "*.bak" | head -n 1)
              
              if [ -n "$md_file" ]; then
                echo "Found markdown file: $md_file"
                
                mkdir -p "build_output/$rel_path"
                chmod 777 "build_output/$rel_path"
                
                theme_arg=""
                if [ -f "${dir}mtech-theme.css" ]; then
                  theme_arg="--theme-set ${dir}mtech-theme.css"
                elif [ -f "presentations/mtech-theme.css" ]; then
                  theme_arg="--theme-set presentations/mtech-theme.css"
                fi
                
                # HTML
                docker run --rm -v "$PWD:/work" -w /work marpteam/marp-cli:latest \
                  $theme_arg --html --allow-local-files \
                  "$md_file" -o "build_output/$rel_path/index.html"
                  
                # PDF
                docker run --rm -v "$PWD:/work" -w /work marpteam/marp-cli:latest \
                  $theme_arg --html --allow-local-files --pdf \
                  "$md_file" -o "build_output/$rel_path/index.pdf"
                
                # Kopiowanie grafik i plików towarzyszących
                find "$dir" -maxdepth 1 -type f ! -name "*.md" ! -name "*.css" ! -name "*.pdf" ! -name "*.bak" -exec cp {} "build_output/$rel_path/" \;
              fi
            fi
          done

      # ==========================================
# ==========================================
      # 2. KROK: Zadania / Assignments (Pandoc Docker)
      # ==========================================
      - name: Process Assignments
        run: |
          echo "=== Processing Assignments ==="
          for dir in assignments/*/; do
            if [ -d "$dir" ]; then
              rel_path=${dir%/}
              
              echo "========================================"
              echo "Processing Assignment: $rel_path"
              echo "========================================"

              md_file=$(find "$dir" -maxdepth 1 -type f -name "*.md" ! -name "*.bak" | head -n 1)

              if [ -n "$md_file" ]; then
                echo "Found assignment file: $md_file"
                
                mkdir -p "build_output/$rel_path"

                # HTML via Pandoc Docker
                docker run --rm --user $(id -u):$(id -g) -v "$PWD:/data" pandoc/extra "$md_file" \
                  --standalone \
                  --from markdown \
                  --to html5 \
                  -o "build_output/$rel_path/index.html"

                # PDF via Pandoc Docker (zmiana na xelatex)
                docker run --rm --user $(id -u):$(id -g) -v "$PWD:/data" pandoc/extra "$md_file" \
                  --pdf-engine=xelatex \
                  -o "build_output/$rel_path/index.pdf"

                # Kopiowanie grafik i załączników
                find "$dir" -maxdepth 1 -type f ! -name "*.md" ! -name "*.bak" -exec cp {} "build_output/$rel_path/" \;

                echo "Generated output in build_output/$rel_path/"
              else
                echo "No Markdown file found in $dir"
              fi
            fi
          done

      # ==========================================
      # 3. KROK: Deploy do repozytorium WWW
      # ==========================================
      - name: Deploy to Public Repository
        run: |
          # Poprawiono literał URL (github.com z małej litery)
          git clone https://${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/jpach-cs/jpach-cs.github.io.git public_repo
          
          mkdir -p public_repo/teaching/csci-232/
          
          # Kopiuje zbudowane pliki z build_output
          cp -r build_output/* public_repo/teaching/csci-232/
          
          cd public_repo
          git config --global user.name "Marp Autograder Bot"
          git config --global user.email "bot@mtech.edu"
          
          git add .
          git diff-index --quiet HEAD || git commit -m "Automated update of CSCI 232 materials"
          git push origin main