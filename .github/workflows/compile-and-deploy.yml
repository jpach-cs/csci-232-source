name: Bulk Compile Marp Slides & Deploy to Web
on:
  push:
    branches:
      - main

jobs:
  build-slides:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Create Global Build Directory
        run: |
          mkdir -p build_output
          chmod 777 build_output

      - name: Compile All Presentations
        run: |
          for dir in presentations/*/; do
            if [ -d "$dir" ]; then
              dir_name=$(basename "$dir")
              echo "Processing directory: $dir_name"
              
              md_file=$(find "$dir" -maxdepth 1 -name "*.md" | head -n 1)
              
              if [ -n "$md_file" ]; then
                echo "Found markdown file: $md_file"
                
                mkdir -p "build_output/$dir_name"
                chmod 777 "build_output/$dir_name"
                
                theme_arg=""
                if [ -f "${dir}mtech-theme.css" ]; then
                  theme_arg="--theme-set ${dir}mtech-theme.css"
                fi
                
                # Kompilacja HTML
                docker run --rm -v "$PWD:/work" -w /work marpteam/marp-cli:latest \
                  $theme_arg --html --allow-local-files \
                  "$md_file" -o "build_output/$dir_name/index.html"
                  
                # Kompilacja PDF
                docker run --rm -v "$PWD:/work" -w /work marpteam/marp-cli:latest \
                  $theme_arg --html --allow-local-files --pdf \
                  "$md_file" -o "build_output/$dir_name/index.pdf"
                
                find "$dir" -maxdepth 1 -type f ! -name "*.md" ! -name "*.css" ! -name "*.pdf" -exec cp {} "build_output/$dir_name/" \;
                
              else
                echo "No markdown file found in $dir, skipping."
              fi
            fi
          done

      - name: Deploy to Public Repository
        run: |
          # 1. Klonowanie publicznego repozytorium strony za pomocą poprawionego tokenu GH_PAT
          git clone https://${{ secrets.GH_PAT }}@github.com/jpach-cs/jpach-cs.github.io.git public_repo
          
          # 2. Upewnienie się, że bazowy folder na slajdy CSCI 232 istnieje
          mkdir -p public_repo/teaching/csci-232/slides/
          
          # 3. Kopiowanie do folderu 232
          cp -r build_output/* public_repo/teaching/csci-232/slides/
          
          # 4. Konfiguracja tożsamości bota Git
          cd public_repo
          git config --global user.name "Marp Autograder Bot"
          git config --global user.email "bot@mtech.edu"
          
          # 5. Sprawdzenie różnic i wypchnięcie na produkcję
          git add .
          git diff-index --quiet HEAD || git commit -m "Automated bulk update of CSCI 232 slides and assets"
          git push origin main